name: Deploy to Salesforce

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI with NPM
        run: |
          npm install sfdx-cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" | sf org login sfdx-url --alias SFDCADDA123 --set-default --sfdx-url-stdin

      - name: Deploy to Salesforce
        run: |
          sf project deploy start --target-org SFDCADDA123 --wait 30